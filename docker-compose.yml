name: dvojcatanauteku

services:
  app:
    build: .docker
    environment:
      NETTE_DEBUG: 1
      PHP_IDE_CONFIG: "serverName=localhost"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html/
      - ./.docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./.docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./.docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: dvojcata
      MARIADB_USER: dvojcata
      MARIADB_PASSWORD: dvojcata
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 5s
      retries: 30
      timeout: 5s
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
